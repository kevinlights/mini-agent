apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-agent.backend.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "mini-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "mini-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_BASE_URL
              value: {{ .Values.backend.env.MODEL_BASE_URL | quote }}
            - name: APP_HOST
              value: {{ .Values.backend.env.APP_HOST | quote }}
            - name: APP_PORT
              value: {{ .Values.backend.env.APP_PORT | quote }}
            - name: APP_DEBUG
              value: {{ .Values.backend.env.APP_DEBUG | quote }}
            - name: MEMORY_PATH
              value: {{ .Values.backend.env.MEMORY_PATH | quote }}
            - name: SKILLS_PATH
              value: {{ .Values.backend.env.SKILLS_PATH | quote }}
            - name: CONTEXT_MAX_TOKENS
              value: {{ .Values.backend.env.CONTEXT_MAX_TOKENS | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mini-agent.backend.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-agent.backend.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "mini-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

{{- if .Values.backend.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mini-agent.backend.fullname" . }}-pvc
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
  {{- if .Values.backend.persistence.storageClass }}
  storageClassName: {{ .Values.backend.persistence.storageClass }}
  {{- end }}
{{- end }}
