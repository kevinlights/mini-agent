{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mini-agent.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mini-agent.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "mini-agent.fullname" . }}
  rules:
    # Frontend route - catch all
    # 前端路由 - 捕获所有
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mini-agent.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
    # Backend API route
    # 后端 API 路由
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "mini-agent.backend.fullname" . }}
          port: {{ .Values.backend.service.port }}
{{- end }}
