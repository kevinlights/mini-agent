apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini-agent.frontend.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "mini-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "mini-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mini-agent.frontend.fullname" . }}
  labels:
    {{- include "mini-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "mini-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
